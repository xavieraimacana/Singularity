<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #060911;
        --ink: #f8fafc;
        --accent: #06b6d4;
        --accent-success: #10b981;
        --font-display: 'Inter', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="56"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 01: Fullscreen Windows App, Terminal Clone & Login Interaction -->
      <div
        id="scene-01-onboarding-login"
        data-composition-id="scene-01-onboarding-login"
        data-composition-src="compositions/scene-01-onboarding-login.html"
        data-start="0"
        data-duration="6.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 02: 3D Isometric Assembly Swoop & Create Server Wizard -->
      <div
        id="scene-02-assembly-wizard"
        data-composition-id="scene-02-assembly-wizard"
        data-composition-src="compositions/scene-02-assembly-wizard.html"
        data-start="6.0"
        data-duration="8.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 03: Full Server Detail View & VT100 Live ANSI Boot -->
      <div
        id="scene-03-console-live"
        data-composition-id="scene-03-console-live"
        data-composition-src="compositions/scene-03-console-live.html"
        data-start="14.0"
        data-duration="8.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        data-hold
      ></div>

      <!-- Scene 04: Intensive Prism Catalog (Modpacks, Mods, 1-Click Install) -->
      <div
        id="scene-04-prism-catalog"
        data-composition-id="scene-04-prism-catalog"
        data-composition-src="compositions/scene-04-prism-catalog.html"
        data-start="22.0"
        data-duration="12.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        data-hold
      ></div>

      <!-- Scene 05: File Manager to Live Antigravity IDE / VS Code Replica -->
      <div
        id="scene-05-antigravity-ide"
        data-composition-id="scene-05-antigravity-ide"
        data-composition-src="compositions/scene-05-antigravity-ide.html"
        data-start="34.0"
        data-duration="10.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        data-hold
      ></div>

      <!-- Scene 06: Desktop System Tray Context Menu & Cloud VPS Switcher -->
      <div
        id="scene-06-desktop-tray-multihost"
        data-composition-id="scene-06-desktop-tray-multihost"
        data-composition-src="compositions/scene-06-desktop-tray-multihost.html"
        data-start="44.0"
        data-duration="6.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 07: Clean, Honest & Accessible Community Closing -->
      <div
        id="scene-07-honest-closing"
        data-composition-id="scene-07-honest-closing"
        data-composition-src="compositions/scene-07-honest-closing.html"
        data-start="50.0"
        data-duration="6.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
