<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #090d16;
        --ink: #f8fafc;
        --accent: #06b6d4;
        --accent-success: #10b981;
        --font-display: 'Inter', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="scene-01-chaos"
        data-composition-id="scene-01-chaos"
        data-composition-src="compositions/scene-01-chaos.html"
        data-start="0"
        data-duration="3.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-02-welcome"
        data-composition-id="scene-02-welcome"
        data-composition-src="compositions/scene-02-welcome.html"
        data-start="3.5"
        data-duration="4.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-03-engine"
        data-composition-id="scene-03-engine"
        data-composition-src="compositions/scene-03-engine.html"
        data-start="7.5"
        data-duration="5.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-04-modpack"
        data-composition-id="scene-04-modpack"
        data-composition-src="compositions/scene-04-modpack.html"
        data-start="13.0"
        data-duration="5.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-05-ide-bridge"
        data-composition-id="scene-05-ide-bridge"
        data-composition-src="compositions/scene-05-ide-bridge.html"
        data-start="18.0"
        data-duration="5.0"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-06-performance"
        data-composition-id="scene-06-performance"
        data-composition-src="compositions/scene-06-performance.html"
        data-start="23.0"
        data-duration="3.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="scene-07-endcard"
        data-composition-id="scene-07-endcard"
        data-composition-src="compositions/scene-07-endcard.html"
        data-start="26.5"
        data-duration="3.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
