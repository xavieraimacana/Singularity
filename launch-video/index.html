<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #090d16;
        --ink: #f8fafc;
        --accent: #06b6d4;
        --accent-success: #10b981;
        --font-display: 'Inter', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="48"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 0: Developer Discovery, Git Clone, Web & Desktop Install -->
      <div
        id="scene-00-discovery"
        data-composition-id="scene-00-discovery"
        data-composition-src="compositions/scene-00-discovery.html"
        data-start="0"
        data-duration="5.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Scene 1: The Chaos & Java 25 Crash -->
      <div
        id="scene-01-chaos"

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
